
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Currículo | Gustavo</title>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>

    <main class="curriculo">

        <!-- Cabeçalho -->
        <header class="cabecalho">

            <div class="barra-superior"></div>

            <h1 id="nome"></h1>

            <h2 id="titulo"></h2>

            <div class="contatos" id="contatos"></div>

        </header>

        <!-- Resumo profissional -->
        <section class="secao">

            <h3 class="titulo-secao">Resumo Profissional</h3>

            <p id="resumo"></p>

        </section>

        <!-- Formação acadêmica -->
        <section class="secao">

            <h3 class="titulo-secao">Formação Acadêmica</h3>

            <div id="formacao"></div>

        </section>

        <!-- Habilidades -->
        <section class="secao">

            <h3 class="titulo-secao">Habilidades</h3>

            <div class="habilidades-container" id="habilidades"></div>

        </section>

        <!-- Projetos -->
        <section class="secao">

            <h3 class="titulo-secao">Projetos</h3>

            <div id="projetos"></div>

        </section>

        <!-- Informações adicionais -->
        <section class="secao">

            <h3 class="titulo-secao">Informações Adicionais</h3>

            <div id="informacoes"></div>

        </section>

        <!-- Rodapé -->
        <footer class="rodape">

            <p>Gustavo | Currículo Profissional</p>

            <button onclick="window.print()" class="botao-imprimir">
                Baixar / Imprimir currículo
            </button>

        </footer>

    </main>

</body>

</html>
